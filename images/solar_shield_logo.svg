<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="100%" height="100%">
  <defs>
    <!-- Sunburst Gradient -->
    <linearGradient id="sunburstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="50%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>

    <!-- Shield Interior Gradient -->
    <radialGradient id="shieldBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="60%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#051B3B"/>
    </radialGradient>

    <!-- Chrome Text Gradient (Top to Bottom) -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E3F2FD"/>
      <stop offset="48%" stop-color="#90CAF9"/>
      <stop offset="50%" stop-color="#1E88E5"/>
      <stop offset="65%" stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0A2D6C"/>
    </linearGradient>

    <!-- Yellow Text Gradient for MOBILE TINTING -->
    <linearGradient id="yellowTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="30%" stop-color="#FFEB3B"/>
      <stop offset="70%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Outer Glow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Heavy Drop Shadow for Letters -->
    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="bannerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- ================= 1. SUNBURST RAYS LAYER ================= -->
  <g id="sunburst-rays" transform="translate(400, 150)">
    <!-- 24 Radial Starburst Rays -->
    <polygon points="0,0 -20,-160 0,-175 20,-160" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 30,-155 52,-168 68,-145" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 80,-135 105,-142 115,-118" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 125,-100 148,-102 150,-78" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 155,-55 178,-50 172,-25" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 165,-10 182,-3 170,22" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 150,38 165,52 145,72" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 120,80 130,98 105,112" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    
    <!-- Left side rays -->
    <polygon points="0,0 -30,-155 -52,-168 -68,-145" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 -80,-135 -105,-142 -115,-118" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 -125,-100 -148,-102 -150,-78" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 -155,-55 -178,-50 -172,-25" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 -165,-10 -182,-3 -170,22" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 -150,38 -165,52 -145,72" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>
    <polygon points="0,0 -120,80 -130,98 -105,112" fill="url(#sunburstGrad)" stroke="#E67E00" stroke-width="2"/>

    <!-- Sharp secondary accents -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#FFD000" stroke-width="3" stroke-dasharray="12 16" opacity="0.8"/>
  </g>

  <!-- ================= 2. SHIELD EMBLEM ================= -->
  <g id="shield-crest">
    <!-- Outer Shield Border Gold -->
    <path d="M 230 40 
             L 570 40 
             Q 590 120 570 200 
             Q 530 290 400 340 
             Q 270 290 230 200 
             Q 210 120 230 40 Z" 
          fill="#FFD000" stroke="#E67E00" stroke-width="4" filter="url(#bannerShadow)"/>

    <!-- Inner Shield Dark Bevel -->
    <path d="M 242 50 
             L 558 50 
             Q 576 122 558 195 
             Q 520 278 400 324 
             Q 280 278 242 195 
             Q 224 122 242 50 Z" 
          fill="#061224" stroke="#000000" stroke-width="5"/>

    <!-- Shield Core Gradient -->
    <path d="M 252 58 
             L 548 58 
             Q 564 124 548 190 
             Q 512 268 400 310 
             Q 288 268 252 190 
             Q 236 124 252 58 Z" 
          fill="url(#shieldBg)"/>

    <!-- Shield Internal Flare / Sun Rays Grid -->
    <path d="M 400 58 L 400 310 M 252 58 L 548 200 M 548 58 L 252 200" stroke="#42A5F5" stroke-width="1.5" stroke-opacity="0.3"/>
    <circle cx="400" cy="140" r="50" fill="#64B5F6" fill-opacity="0.25" filter="url(#logoGlow)"/>
  </g>

  <!-- ================= 3. "SolarShield" 3D CHROME LETTERING ================= -->
  <!-- Layer A: Deep Black Drop Outline for Maximum Legibility -->
  <g filter="url(#letterShadow)">
    <text x="400" y="210" 
          font-family="'Barlow Condensed', 'Arial Black', sans-serif" 
          font-size="125" 
          font-weight="900" 
          font-style="italic" 
          text-anchor="middle" 
          letter-spacing="-1" 
          fill="#000000" 
          stroke="#000000" 
          stroke-width="26" 
          stroke-linejoin="round">
      SolarShield
    </text>
  </g>

  <!-- Layer B: Dark Royal Blue Outer Stroke -->
  <g>
    <text x="400" y="210" 
          font-family="'Barlow Condensed', 'Arial Black', sans-serif" 
          font-size="125" 
          font-weight="900" 
          font-style="italic" 
          text-anchor="middle" 
          letter-spacing="-1" 
          fill="#0D47A1" 
          stroke="#0D47A1" 
          stroke-width="16" 
          stroke-linejoin="round">
      SolarShield
    </text>
  </g>

  <!-- Layer C: Golden / White Accent Bevel Edge -->
  <g>
    <text x="400" y="210" 
          font-family="'Barlow Condensed', 'Arial Black', sans-serif" 
          font-size="125" 
          font-weight="900" 
          font-style="italic" 
          text-anchor="middle" 
          letter-spacing="-1" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linejoin="round">
      SolarShield
    </text>
  </g>

  <!-- Layer D: High-Gloss Metallic Chrome Fill -->
  <g>
    <text x="400" y="210" 
          font-family="'Barlow Condensed', 'Arial Black', sans-serif" 
          font-size="125" 
          font-weight="900" 
          font-style="italic" 
          text-anchor="middle" 
          letter-spacing="-1" 
          fill="url(#chromeGrad)">
      SolarShield
    </text>
  </g>

  <!-- ================= 4. "MOBILE TINTING" RIBBON & BADGE ================= -->
  <!-- Dark Curved Under-Banner for High Contrast -->
  <g filter="url(#bannerShadow)">
    <!-- Lower Banner Ribbon -->
    <path d="M 120 225 
             L 680 225 
             L 660 305 
             L 400 320 
             L 140 305 Z" 
          fill="#000000" stroke="#FFD000" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Inner Ribbon Edge -->
    <path d="M 130 235 
             L 670 235 
             L 652 295 
             L 400 310 
             L 148 295 Z" 
          fill="#0B1321" stroke="#1E88E5" stroke-width="2"/>
  </g>

  <!-- "MOBILE TINTING" Bold Italic Yellow Racing Typography -->
  <!-- Black Drop Stroke -->
  <text x="400" y="282" 
        font-family="'Barlow Condensed', 'Arial Black', sans-serif" 
        font-size="52" 
        font-weight="900" 
        font-style="italic" 
        text-anchor="middle" 
        letter-spacing="5" 
        fill="#000000" 
        stroke="#000000" 
        stroke-width="8" 
        stroke-linejoin="round">
    MOBILE TINTING
  </text>

  <!-- Yellow-Gold Gradient Fill -->
  <text x="400" y="282" 
        font-family="'Barlow Condensed', 'Arial Black', sans-serif" 
        font-size="52" 
        font-weight="900" 
        font-style="italic" 
        text-anchor="middle" 
        letter-spacing="5" 
        fill="url(#yellowTextGrad)">
    MOBILE TINTING
  </text>

  <!-- Subtle Wing / Speed Lines at sides of Banner -->
  <path d="M 80 245 L 125 245 L 140 275 L 95 275 Z" fill="#FFD000" stroke="#000000" stroke-width="2"/>
  <path d="M 720 245 L 675 245 L 660 275 L 705 275 Z" fill="#FFD000" stroke="#000000" stroke-width="2"/>
</svg>
