<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 840" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="mapBgGrad" cx="55%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1728"/>
      <stop offset="60%" stop-color="#070e1a"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>

    <!-- Unified County Glow Filters -->
    <filter id="countyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cohesive County Gradient Fills -->
    <linearGradient id="citrusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D62D9" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.10" />
    </linearGradient>

    <linearGradient id="hernandoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D62D9" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FFD000" stop-opacity="0.12" />
    </linearGradient>

    <linearGradient id="pascoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D62D9" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.10" />
    </linearGradient>

    <!-- Radar Coordinate Grid -->
    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="840" rx="20" fill="url(#mapBgGrad)" stroke="#1a2638" stroke-width="2"/>
  <rect width="800" height="840" rx="20" fill="url(#radarGrid)"/>

  <!-- Top Title Header -->
  <g transform="translate(400, 44)" text-anchor="middle">
    <rect x="-220" y="-24" width="440" height="44" rx="22" fill="#040812" stroke="#FFD000" stroke-width="1.8"/>
    <text y="5" fill="#FFD000" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="2">
      TRI-COUNTY SERVICE AREA
    </text>
  </g>
  <text x="400" y="82" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">
    CITRUS • HERNANDO • PASCO COUNTIES — FLORIDA GULF COAST
  </text>

  <!-- Gulf of Mexico Coastline -->
  <path d="M 0 0 L 140 0 Q 105 160 120 300 T 95 480 T 115 660 T 85 840 L 0 840 Z" fill="#020409" opacity="0.85"/>
  <path d="M 140 0 Q 105 160 120 300 T 95 480 T 115 660 T 85 840" fill="none" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.25" filter="url(#countyGlow)"/>
  <text x="55" y="440" fill="#1a3355" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="800" font-style="italic" letter-spacing="6" transform="rotate(-90 55 440)">GULF OF MEXICO</text>

  <!-- ================= 1. CITRUS COUNTY ================= -->
  <polygon points="140,110 460,95 700,105 710,265 400,280 130,280" 
           fill="url(#citrusGrad)" stroke="#00D2FF" stroke-width="2.5" filter="url(#countyGlow)"/>

  <!-- Citrus County Header Pill -->
  <rect x="370" y="125" width="260" height="38" rx="10" fill="#030814" stroke="#00D2FF" stroke-width="1.8"/>
  <text x="500" y="150" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="20" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">
    CITRUS COUNTY
  </text>

  <!-- Crystal River -->
  <g transform="translate(230, 185)">
    <circle cx="0" cy="0" r="5" fill="#00D2FF" stroke="#000" stroke-width="2"/>
    <rect x="-8" y="-22" width="94" height="20" rx="5" fill="#000" stroke="#00D2FF" stroke-width="1" fill-opacity="0.9"/>
    <text x="39" y="-8" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Crystal River</text>
  </g>

  <!-- Inverness -->
  <g transform="translate(560, 200)">
    <circle cx="0" cy="0" r="5" fill="#00D2FF" stroke="#000" stroke-width="2"/>
    <rect x="-8" y="-22" width="76" height="20" rx="5" fill="#000" stroke="#00D2FF" stroke-width="1" fill-opacity="0.9"/>
    <text x="30" y="-8" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Inverness</text>
  </g>

  <!-- Homosassa -->
  <g transform="translate(250, 240)">
    <circle cx="0" cy="0" r="5" fill="#00D2FF" stroke="#000" stroke-width="2"/>
    <rect x="-8" y="-22" width="86" height="20" rx="5" fill="#000" stroke="#00D2FF" stroke-width="1" fill-opacity="0.9"/>
    <text x="35" y="-8" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Homosassa</text>
  </g>

  <!-- ================= 2. HERNANDO COUNTY ================= -->
  <polygon points="130,280 400,280 710,265 730,520 360,530 120,495" 
           fill="url(#hernandoGrad)" stroke="#FFD000" stroke-width="2.5" filter="url(#countyGlow)"/>

  <!-- Hernando County Header Pill (Equal styling, no stars, no hub) -->
  <rect x="360" y="305" width="280" height="38" rx="10" fill="#040914" stroke="#FFD000" stroke-width="1.8"/>
  <text x="500" y="330" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="20" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">
    HERNANDO COUNTY
  </text>

  <!-- Spring Hill (Standard city pin, no special HQ or star) -->
  <g transform="translate(390, 440)">
    <circle cx="0" cy="0" r="5" fill="#FFD000" stroke="#000" stroke-width="2"/>
    <rect x="-8" y="-22" width="88" height="20" rx="5" fill="#000" stroke="#FFD000" stroke-width="1" fill-opacity="0.9"/>
    <text x="36" y="-8" fill="#FFD000" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Spring Hill</text>
  </g>

  <!-- Brooksville -->
  <g transform="translate(580, 420)">
    <circle cx="0" cy="0" r="5" fill="#FFD000" stroke="#000" stroke-width="2"/>
    <rect x="-8" y="-22" width="88" height="20" rx="5" fill="#000" stroke="#FFD000" stroke-width="1" fill-opacity="0.9"/>
    <text x="36" y="-8" fill="#FFD000" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Brooksville</text>
  </g>

  <!-- Weeki Wachee -->
  <g transform="translate(230, 405)">
    <circle cx="0" cy="0" r="5" fill="#FFD000" stroke="#000" stroke-width="2"/>
    <rect x="-8" y="-22" width="102" height="20" rx="5" fill="#000" stroke="#FFD000" stroke-width="1" fill-opacity="0.9"/>
    <text x="43" y="-8" fill="#FFD000" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Weeki Wachee</text>
  </g>

  <!-- ================= 3. PASCO COUNTY ================= -->
  <polygon points="120,495 360,530 730,520 740,710 420,720 110,690" 
           fill="url(#pascoGrad)" stroke="#00D2FF" stroke-width="2.5" filter="url(#countyGlow)"/>

  <!-- Pasco County Header Pill -->
  <rect x="370" y="550" width="260" height="38" rx="10" fill="#030814" stroke="#00D2FF" stroke-width="1.8"/>
  <text x="500" y="575" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="20" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">
    PASCO COUNTY
  </text>

  <!-- New Port Richey -->
  <g transform="translate(215, 620)">
    <circle cx="0" cy="0" r="5" fill="#00D2FF" stroke="#000" stroke-width="2"/>
    <rect x="-8" y="-22" width="112" height="20" rx="5" fill="#000" stroke="#00D2FF" stroke-width="1" fill-opacity="0.9"/>
    <text x="48" y="-8" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">New Port Richey</text>
  </g>

  <!-- Trinity -->
  <g transform="translate(310, 670)">
    <circle cx="0" cy="0" r="5" fill="#00D2FF" stroke="#000" stroke-width="2"/>
    <rect x="-8" y="-22" width="60" height="20" rx="5" fill="#000" stroke="#00D2FF" stroke-width="1" fill-opacity="0.9"/>
    <text x="22" y="-8" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Trinity</text>
  </g>

  <!-- Land O' Lakes -->
  <g transform="translate(480, 640)">
    <circle cx="0" cy="0" r="5" fill="#00D2FF" stroke="#000" stroke-width="2"/>
    <rect x="-8" y="-22" width="96" height="20" rx="5" fill="#000" stroke="#00D2FF" stroke-width="1" fill-opacity="0.9"/>
    <text x="40" y="-8" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Land O' Lakes</text>
  </g>

  <!-- Wesley Chapel -->
  <g transform="translate(620, 660)">
    <circle cx="0" cy="0" r="5" fill="#00D2FF" stroke="#000" stroke-width="2"/>
    <rect x="-8" y="-22" width="102" height="20" rx="5" fill="#000" stroke="#00D2FF" stroke-width="1" fill-opacity="0.9"/>
    <text x="43" y="-8" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Wesley Chapel</text>
  </g>

  <!-- ================= BOTTOM CONTACT & SERVICE BAR (LARGE, CRISP, EASY TO READ) ================= -->
  <g transform="translate(400, 775)" text-anchor="middle">
    <!-- Solid Dark Pill with Gold Border -->
    <rect x="-310" y="-36" width="620" height="66" rx="20" fill="#040814" stroke="#FFD000" stroke-width="2.2" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.8))"/>
    
    <!-- Large, Clear, High-Contrast Phone Number -->
    <text y="-6" fill="#FFD000" font-family="'Barlow Condensed', sans-serif" font-size="24" font-weight="900" font-style="italic" letter-spacing="2">
      CALL OR TEXT: (727) 598-TINT
    </text>
    
    <!-- Clean Subtitle -->
    <text y="18" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="700" letter-spacing="1">
      100% MOBILE SERVICE • WE COME TO YOUR HOME OR WORKPLACE
    </text>
  </g>
</svg>
