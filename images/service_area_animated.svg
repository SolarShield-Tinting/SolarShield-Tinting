<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="100%" height="100%">
  <defs>
    <radialGradient id="mapBgGrad" cx="60%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1d33"/>
      <stop offset="60%" stop-color="#08101e"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="hernandoZone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0.10" />
    </linearGradient>

    <linearGradient id="citrusZone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D62D9" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.10" />
    </linearGradient>

    <linearGradient id="pascoZone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D62D9" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.10" />
    </linearGradient>

    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>

  </defs>

  <!-- Background -->
  <rect width="800" height="820" rx="20" fill="url(#mapBgGrad)" stroke="#1a2638" stroke-width="2"/>
  <rect width="800" height="820" rx="20" fill="url(#radarGrid)"/>

  <!-- Title -->
  <g transform="translate(400, 42)" text-anchor="middle">
    <rect x="-200" y="-24" width="400" height="42" rx="20" fill="#040812" stroke="#FFD000" stroke-width="1.5"/>
    <text y="3" fill="#FFD000" font-family="'Barlow Condensed', sans-serif" font-size="20" font-weight="900" font-style="italic" letter-spacing="2">
      SOLARSHIELD SERVICE AREA
    </text>
  </g>
  <text x="400" y="80" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1">
    HERNANDO • PASCO • CITRUS COUNTIES — FLORIDA GULF COAST
  </text>

  <!-- Gulf of Mexico Coastline -->
  <path d="M 0 0 L 140 0 Q 105 160 120 300 T 95 480 T 115 660 T 85 820 L 0 820 Z" fill="#020409" opacity="0.85"/>
  <path d="M 140 0 Q 105 160 120 300 T 95 480 T 115 660 T 85 820" fill="none" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.25" filter="url(#blueGlow)"/>
  <text x="55" y="430" fill="#1a3355" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="800" font-style="italic" letter-spacing="6" transform="rotate(-90 55 430)">GULF OF MEXICO</text>

  <!-- ===== CITRUS COUNTY ===== -->
  <polygon points="140,110 460,95 700,105 710,265 400,280 130,280" 
           fill="url(#citrusZone)" stroke="#00D2FF" stroke-width="2"/>

  <rect x="380" y="125" width="240" height="36" rx="8" fill="#040916" stroke="#00D2FF" stroke-width="1.5"/>
  <text x="500" y="149" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">
    CITRUS COUNTY
  </text>

  <!-- Crystal River -->
  <g transform="translate(230, 185)">
    <circle cx="0" cy="0" r="4" fill="#00D2FF" stroke="#000" stroke-width="1.5"/>
    <rect x="-8" y="-20" width="88" height="16" rx="4" fill="#000" fill-opacity="0.85"/>
    <text x="36" y="-8" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Crystal River</text>
  </g>

  <!-- Inverness -->
  <g transform="translate(560, 200)">
    <circle cx="0" cy="0" r="4" fill="#00D2FF" stroke="#000" stroke-width="1.5"/>
    <rect x="-8" y="-20" width="70" height="16" rx="4" fill="#000" fill-opacity="0.85"/>
    <text x="27" y="-8" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Inverness</text>
  </g>

  <!-- Homosassa -->
  <g transform="translate(250, 240)">
    <circle cx="0" cy="0" r="3.5" fill="#00D2FF" stroke="#000" stroke-width="1.5"/>
    <rect x="-8" y="-20" width="78" height="16" rx="4" fill="#000" fill-opacity="0.85"/>
    <text x="31" y="-8" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Homosassa</text>
  </g>

  <!-- ===== HERNANDO COUNTY ===== -->
  <polygon points="130,280 400,280 710,265 730,520 360,530 120,495" 
           fill="url(#hernandoZone)" stroke="#FFD000" stroke-width="3.5" filter="url(#goldGlow)"/>

  <!-- County Label -->
  <rect x="290" y="305" width="380" height="42" rx="10" fill="#000000" stroke="#FFD000" stroke-width="2"/>
  <text x="480" y="333" fill="#FFD000" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">
    ★ HERNANDO COUNTY ★
  </text>

  <!-- Spring Hill HQ -->
  <g transform="translate(390, 440)">
    <circle cx="0" cy="0" r="16" fill="rgba(255,208,0,0.25)" stroke="#FFD000" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="9" fill="#FFD000" stroke="#000" stroke-width="2"/>
    <text x="0" y="3.5" fill="#000000" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle">★</text>
    
    <rect x="-55" y="22" width="110" height="22" rx="6" fill="#000000" stroke="#FFD000" stroke-width="1.5"/>
    <text x="0" y="37" fill="#FFD000" font-family="'Barlow Condensed', sans-serif" font-size="13" font-weight="900" font-style="italic" letter-spacing="1" text-anchor="middle">SPRING HILL HQ</text>
  </g>

  <!-- Brooksville -->
  <g transform="translate(580, 420)">
    <circle cx="0" cy="0" r="5" fill="#FFD000" stroke="#000" stroke-width="1.5"/>
    <rect x="-8" y="-20" width="82" height="16" rx="4" fill="#000" stroke="#FFD000" stroke-width="1"/>
    <text x="33" y="-8" fill="#FFD000" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Brooksville</text>
  </g>

  <!-- Weeki Wachee -->
  <g transform="translate(230, 405)">
    <circle cx="0" cy="0" r="4" fill="#FFD000" stroke="#000" stroke-width="1.5"/>
    <rect x="-8" y="-20" width="96" height="16" rx="4" fill="#000" stroke="#FFD000" stroke-width="1"/>
    <text x="40" y="-8" fill="#FFD000" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Weeki Wachee</text>
  </g>

  <!-- ===== PASCO COUNTY ===== -->
  <polygon points="120,495 360,530 730,520 740,720 420,730 110,700" 
           fill="url(#pascoZone)" stroke="#00D2FF" stroke-width="2"/>

  <rect x="380" y="555" width="240" height="36" rx="8" fill="#040916" stroke="#00D2FF" stroke-width="1.5"/>
  <text x="500" y="579" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">
    PASCO COUNTY
  </text>

  <!-- New Port Richey -->
  <g transform="translate(215, 625)">
    <circle cx="0" cy="0" r="4" fill="#00D2FF" stroke="#000" stroke-width="1.5"/>
    <rect x="-8" y="-20" width="106" height="16" rx="4" fill="#000" fill-opacity="0.85"/>
    <text x="45" y="-8" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">New Port Richey</text>
  </g>

  <!-- Trinity -->
  <g transform="translate(310, 680)">
    <circle cx="0" cy="0" r="3.5" fill="#00D2FF" stroke="#000" stroke-width="1.5"/>
    <rect x="-8" y="-20" width="55" height="16" rx="4" fill="#000" fill-opacity="0.85"/>
    <text x="20" y="-8" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Trinity</text>
  </g>

  <!-- Land O Lakes -->
  <g transform="translate(480, 650)">
    <circle cx="0" cy="0" r="4" fill="#00D2FF" stroke="#000" stroke-width="1.5"/>
    <rect x="-8" y="-20" width="90" height="16" rx="4" fill="#000" fill-opacity="0.85"/>
    <text x="37" y="-8" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Land O' Lakes</text>
  </g>

  <!-- Wesley Chapel -->
  <g transform="translate(620, 670)">
    <circle cx="0" cy="0" r="3.5" fill="#00D2FF" stroke="#000" stroke-width="1.5"/>
    <rect x="-8" y="-20" width="95" height="16" rx="4" fill="#000" fill-opacity="0.85"/>
    <text x="40" y="-8" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Wesley Chapel</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(400, 775)" text-anchor="middle">
    <rect x="-300" y="-20" width="600" height="38" rx="14" fill="#02050b" stroke="#FFD000" stroke-width="1.5"/>
    <text y="1" fill="#FFD000" font-family="'Barlow Condensed', sans-serif" font-size="14" font-weight="900" font-style="italic" letter-spacing="1">
      WE COME TO YOU • NO EXTRA TRAVEL FEES
    </text>
    <text y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600">
      CALL OR TEXT: (727) 598-TINT
    </text>
  </g>
</svg>
