<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="100%" height="100%">
  <defs>
    <!-- Load the brand font inside the SVG; it is embedded with <object>, so it can't use the page's fonts -->
    <style>@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&amp;display=swap');</style>
    <radialGradient id="mapBgGrad" cx="60%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e1d33"/>
      <stop offset="60%" stop-color="#08101e"/>
      <stop offset="100%" stop-color="#03060c"/>
    </radialGradient>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="hernandoZone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="citrusZone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D62D9" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="pascoZone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D62D9" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0.08" />
    </linearGradient>

    <pattern id="radarGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="820" rx="20" fill="url(#mapBgGrad)" stroke="#1a2638" stroke-width="2"/>
  <rect width="800" height="820" rx="20" fill="url(#radarGrid)"/>

  <!-- Title -->
  <g transform="translate(400, 42)" text-anchor="middle">
    <rect x="-200" y="-24" width="400" height="42" rx="20" fill="#040812" stroke="#FFD000" stroke-width="1.5"/>
    <text y="3" fill="#FFD000" font-family="'Barlow Condensed', sans-serif" font-size="20" font-weight="900" font-style="italic" letter-spacing="2">
      SOLARSHIELD SERVICE AREA
    </text>
  </g>
  <text x="400" y="80" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="1">
    HERNANDO • PASCO • CITRUS COUNTIES — FLORIDA GULF COAST
  </text>

  <!-- Gulf of America Coastline -->
  <path d="M 0 0 L 140 0 Q 105 160 120 300 T 95 480 T 115 660 T 85 820 L 0 820 Z" fill="#020409" opacity="0.85"/>
  <path d="M 140 0 Q 105 160 120 300 T 95 480 T 115 660 T 85 820" fill="none" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.25" filter="url(#blueGlow)"/>
  <text x="55" y="440" fill="#2a5282" font-family="'Barlow Condensed', sans-serif" font-size="20" font-weight="900" font-style="italic" letter-spacing="6" transform="rotate(-90 55 440)">GULF OF AMERICA</text>

  <!-- ===== CITRUS COUNTY ===== -->
  <polygon points="140,110 460,95 700,105 710,265 400,280 130,280" 
           fill="url(#citrusZone)" stroke="#00D2FF" stroke-width="2.5"/>

  <g transform="translate(420, 185)">
    <rect x="-140" y="-22" width="280" height="44" rx="10" fill="#040916" stroke="#00D2FF" stroke-width="2"/>
    <text x="0" y="6" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">
      CITRUS COUNTY
    </text>
  </g>

  <!-- ===== HERNANDO COUNTY ===== -->
  <polygon points="130,280 400,280 710,265 730,520 360,530 120,495" 
           fill="url(#hernandoZone)" stroke="#FFD000" stroke-width="3" filter="url(#goldGlow)"/>

  <!-- County Label -->
  <g transform="translate(430, 400)">
    <rect x="-175" y="-24" width="350" height="48" rx="12" fill="#040916" stroke="#FFD000" stroke-width="2"/>
    <text x="0" y="7" fill="#FFD000" font-family="'Barlow Condensed', sans-serif" font-size="24" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">
      HERNANDO COUNTY
    </text>
  </g>

  <!-- ===== PASCO COUNTY ===== -->
  <polygon points="120,495 360,530 730,520 740,710 420,720 110,690" 
           fill="url(#pascoZone)" stroke="#00D2FF" stroke-width="2.5"/>

  <g transform="translate(430, 610)">
    <rect x="-140" y="-22" width="280" height="44" rx="10" fill="#040916" stroke="#00D2FF" stroke-width="2"/>
    <text x="0" y="6" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">
      PASCO COUNTY
    </text>
  </g>

  <!-- Bottom Bar with Enlarged Prominent Call / Text Information -->
  <g transform="translate(400, 765)" text-anchor="middle">
    <rect x="-320" y="-30" width="640" height="60" rx="16" fill="#02050b" stroke="#FFD000" stroke-width="2"/>
    <text y="-7" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="15" font-weight="800" font-style="italic" letter-spacing="1.5">
      WE COME TO YOU • NO EXTRA TRAVEL FEES
    </text>
    <text y="18" fill="#FFD000" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="2">
      CALL OR TEXT: (727) 598-TINT <tspan fill="#FFFFFF" font-size="17" font-weight="700">(8468)</tspan>
    </text>
  </g>
</svg>
