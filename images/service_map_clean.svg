<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e" />
      <stop offset="50%" stop-color="#050a12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- County Zone Gradients -->
    <linearGradient id="hernandoFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#FF9500" stop-opacity="0.10" />
    </linearGradient>

    <linearGradient id="citrusFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="pascoFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="700" height="720" rx="16" fill="url(#bgGrad)" stroke="#1a2736" stroke-width="2" />

  <!-- Coastline Waves / Water Shimmer -->
  <path d="M 175 0 Q 140 80 150 140 T 130 250 T 120 370 T 140 480 T 145 600 T 120 720" fill="none" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.4" filter="url(#glow-blue)" />
  <path d="M 165 0 Q 130 80 140 140 T 120 250 T 110 370 T 130 480 T 135 600 T 110 720" fill="none" stroke="#0077ff" stroke-width="1.5" stroke-opacity="0.25" />

  <text x="60" y="380" fill="#244d7a" font-family="'Barlow Condensed', sans-serif" font-size="24" font-weight="900" font-style="italic" letter-spacing="5" transform="rotate(-90 60 380)">GULF OF AMERICA</text>

  <!-- ================= 1. CITRUS COUNTY ================= -->
  <g id="citrus-county">
    <polygon points="150,140 210,120 480,120 485,250 240,250 130,250" 
             fill="url(#citrusFill)" stroke="#00D2FF" stroke-width="2.5" />
    
    <rect x="230" y="165" width="220" height="44" rx="8" fill="#08101d" stroke="#00D2FF" stroke-width="1.5" />
    <text x="340" y="194" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">CITRUS COUNTY</text>
  </g>

  <!-- ================= 2. HERNANDO COUNTY ================= -->
  <g id="hernando-county">
    <polygon points="130,250 240,250 485,250 500,410 140,410 120,370" 
             fill="url(#hernandoFill)" stroke="#FFD000" stroke-width="3.5" filter="url(#glow-gold)" />

    <rect x="210" y="305" width="260" height="48" rx="10" fill="#040916" stroke="#FFD000" stroke-width="2" />
    <text x="340" y="337" fill="#FFD000" font-family="'Barlow Condensed', sans-serif" font-size="24" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">HERNANDO COUNTY</text>
  </g>

  <!-- ================= 3. PASCO COUNTY ================= -->
  <g id="pasco-county">
    <polygon points="140,410 500,410 525,590 145,590 140,480" 
             fill="url(#pascoFill)" stroke="#00D2FF" stroke-width="2.5" />

    <rect x="225" y="475" width="240" height="44" rx="8" fill="#08101d" stroke="#00D2FF" stroke-width="1.5" />
    <text x="345" y="504" fill="#FFFFFF" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="900" font-style="italic" letter-spacing="2" text-anchor="middle">PASCO COUNTY</text>
  </g>

  <!-- Bottom Mobile Dispatch Banner -->
  <g transform="translate(350, 655)" text-anchor="middle">
    <rect x="-260" y="-24" width="520" height="48" rx="14" fill="#000000" stroke="#FFD000" stroke-width="2" />
    <text y="7" fill="#FFD000" font-family="'Barlow Condensed', sans-serif" font-size="20" font-weight="900" font-style="italic" letter-spacing="2">
      CALL OR TEXT: (727) 598-TINT <tspan fill="#FFFFFF" font-size="16" font-weight="700">(8468)</tspan>
    </text>
  </g>
</svg>
