<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%">
  <defs>
    <linearGradient id="navShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="60%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#051B3B"/>
    </linearGradient>
    <linearGradient id="navGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="50%" stop-color="#FFD000"/>
      <stop offset="100%" stop-color="#E67E00"/>
    </linearGradient>
    <filter id="navGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left: Shield Crest Emblem -->
  <g transform="translate(10, 5)">
    <!-- Sunburst subtle rays -->
    <path d="M 35 15 L 35 3 M 35 15 L 45 6 M 35 15 L 50 14 M 35 15 L 25 6 M 35 15 L 20 14" stroke="#FFD000" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <circle cx="35" cy="24" r="8" fill="#FFD000" filter="url(#navGlow)"/>

    <!-- Outer Gold Shield Border -->
    <path d="M 12 12 L 58 12 Q 62 30 58 46 Q 48 64 35 70 Q 22 64 12 46 Q 8 30 12 12 Z" fill="#000000" stroke="url(#navGoldGrad)" stroke-width="3"/>
    <!-- Inner Blue Shield -->
    <path d="M 16 16 L 54 16 Q 57 32 54 44 Q 45 58 35 64 Q 25 58 16 44 Q 13 32 16 16 Z" fill="url(#navShieldGrad)"/>
    
    <!-- Tint film glass bands across shield -->
    <path d="M 18 30 L 52 30" stroke="#00D2FF" stroke-width="2.5" opacity="0.7"/>
    <path d="M 21 40 L 49 40" stroke="#00D2FF" stroke-width="2.5" opacity="0.7"/>
    <path d="M 26 50 L 44 50" stroke="#00D2FF" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- Right: Sharp Brand Typography -->
  <text x="88" y="44" 
        font-family="'Barlow Condensed', 'Arial Black', sans-serif" 
        font-size="42" 
        font-weight="900" 
        font-style="italic" 
        letter-spacing="-0.5" 
        fill="#FFFFFF">
    SOLAR<tspan fill="#FFD000">SHIELD</tspan>
  </text>

  <!-- Tagline Banner Text -->
  <text x="90" y="64" 
        font-family="'Barlow Condensed', 'Arial Black', sans-serif" 
        font-size="14" 
        font-weight="800" 
        font-style="italic" 
        letter-spacing="5" 
        fill="#94A3B8">
    MOBILE TINTING
  </text>
</svg>
