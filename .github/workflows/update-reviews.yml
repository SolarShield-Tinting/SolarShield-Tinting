name: Update Google reviews

on:
  schedule:
    - cron: "0 11 * * *"   # daily, 7am Eastern
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull rating, count and reviews from Google
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: python scripts/update_reviews.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "Reviews unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Google reviews"
          git push
